<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="t d"><title id="t">VOLT Drink Station Context Diagram</title><desc id="d">System boundary and external interfaces. Operator CLI access is not an implemented admin web screen.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536171"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#182b3d">VOLT Drink Station Context Diagram</text><text x="30" y="65" font-family="Arial,sans-serif" font-size="12" fill="#536171">System boundary and external interfaces. Operator CLI access is not an implemented admin web screen.</text><rect x="15" y="100" width="1090" height="220" rx="8" fill="none" stroke="#d8e0e6"/><rect x="30" y="155" width="200" height="120" rx="2" fill="#f2eee4" stroke="#7890a3" stroke-width="1.4"/><text x="130.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#21394c">Browser customer</text><rect x="400" y="155" width="300" height="120" rx="20" fill="#eaf0f8" stroke="#7890a3" stroke-width="1.4"/><text x="550.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#21394c">0 VOLT</text><text x="550.0" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#21394c">Drink Station</text><rect x="870" y="155" width="220" height="120" rx="2" fill="#e8f1ed" stroke="#7890a3" stroke-width="1.4"/><path d="M882 155V275" fill="none" stroke="#7890a3"/><text x="980.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#21394c">Application operator</text><text x="980.0" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#21394c">CLI / file operations</text><path d="M230 185H400" stroke="#536171" fill="none" stroke-width="1.6" marker-end="url(#a)"/><path d="M400 245H230" stroke="#536171" fill="none" stroke-width="1.6" marker-end="url(#a)"/><text x="315" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Catalog / cart action</text><text x="315" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Order id + session</text><text x="315" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Products / order</text><text x="315" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Status / rewards</text><path d="M700 185H870" stroke="#536171" fill="none" stroke-width="1.6" marker-end="url(#a)"/><path d="M870 245H700" stroke="#536171" fill="none" stroke-width="1.6" marker-end="url(#a)"/><text x="785" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">No admin API</text><text x="785" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Run / backup via CLI</text><text x="785" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Operational output</text><text x="785" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#21394c">Outside purchase API</text><text x="30" y="362" font-family="Arial,sans-serif" font-size="11" fill="#66798a">Request and response arrows are explicit. Repeated store labels refer to the same stored data.</text></svg>